[package]
name = "hostbee"
version = "0.1.0"
edition = "2024"
description = "rustybee 后端的 agent 专用 CLI 客户端"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
toml = "0.9"
# HTTP 客户端选型见 README：ureq（同步、依赖树小、启动延迟低），
# TLS 用 rustls + ring provider，不链接 openssl。
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
# e2e harness 的内存 stub GraphQL server（见 tests/e2e/）
tiny_http = "0.12"
tempfile = "3"